<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost World Profit / Loss</title>
<meta name="description" content="Every day of Boost World's profit and loss since February 2022, by year, month, day and sportsbook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Boost World's public P/L (website_export.py writes data/ next to this page). A read-only copy of the P/L page on Jake's
     PC: All time > year > month > day. Embedded under boostworld.us's Results chart: it tells its frame its height
     ("boostworld-pl-height") and asks it to scroll to its top when a view changes ("boostworld-pl-top"). -->
<style>
  html, body { margin: 0; background: #0a0f1a; color: #9aa8bd; font-family: Inter, system-ui, sans-serif; }
  body.embedded { background: transparent; }
  .boot { padding: 80px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap"><div class="shell" id="app"><div class="boot">Loading the P/L…</div></div></div>
<div class="tip" id="tip"></div>
<script>
// The page's look and code (app.css / app.js) load with the data's build stamp in their address, so a change to them shows at
// once: GitHub Pages lets browsers keep a file 10 minutes (Nov 1: the Base44 preview kept showing the old page). The data
// itself is always asked fresh.
(() => {
  if (window.parent !== window) document.body.classList.add("embedded");
  fetch("data/pl.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    window.__PL = d;
    const v = encodeURIComponent(d.build || d.updated || Date.now());
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = `app.css?v=${v}`;
    css.onload = css.onerror = () => { const js = document.createElement("script"); js.src = `app.js?v=${v}`; document.body.appendChild(js); };
    document.head.appendChild(css);
  }).catch(() => { document.getElementById("app").innerHTML = "<div class=\"boot\">The P/L couldn't be loaded. Refresh in a moment.</div>"; });
})();
</script>
</body>
</html>
